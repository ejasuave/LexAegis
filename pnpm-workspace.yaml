packages:
  - apps/*
  - packages/*
  - examples/*
  - contracts
  - tooling
  - tests
  - indexer
allowBuilds:
  # Postinstall only recreates symlinks inside the package's own native/ directory (reviewed).
  '@embedded-postgres/darwin-arm64': true
  '@embedded-postgres/darwin-x64': true
  '@embedded-postgres/linux-arm64': true
  '@embedded-postgres/linux-x64': true
  esbuild: false
# Advisory fixes for transitive dependencies of the indexer's `envio` (it pins express 4.19.2 exactly and
# its newest release still does). Each selector matches ONLY the vulnerable range, so nothing else is moved.
# Remove an entry once envio ships a fixed version. Reachability: docs/system-validation/findings.json.
overrides:
  'express@<4.20.0': 4.22.3
  'body-parser@<1.20.6': 1.20.8
  'path-to-regexp@<0.1.13': 0.1.13
  'qs@<6.16.0': 6.16.0
  'send@<0.19.0': 0.19.2
  'serve-static@<1.16.0': 1.16.3
  'cookie@<0.7.0': 0.7.2
  'ws@>=8.0.0 <8.21.0': 8.22.0
  'esbuild@>=0.27.3 <0.28.1': 0.28.2
minimumReleaseAgeExclude:
  - vite@8.3.4
  - '@aws-sdk/client-s3@3.1148.0'
