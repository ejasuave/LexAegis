# Pinned build inputs for ProofOfReviewRegistry. The Foundry version itself is pinned in
# toolchain.json and enforced by scripts/foundry.ts; Solidity libraries are pinned in pnpm-lock.yaml.
[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
cache_path = "cache"
broadcast = "broadcast"
libs = ["node_modules"]
# pnpm links packages into the workspace store one level up.
allow_paths = ["../node_modules"]
remappings = [
    "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
    "forge-std/=node_modules/forge-std/src/",
]
auto_detect_remappings = false

# Compiler: exact version and EVM target, never an implicit default.
solc = "0.8.37"
auto_detect_solc = false
evm_version = "osaka"
optimizer = true
optimizer_runs = 200
via_ir = false
# Runtime code must not depend on local source paths, so no metadata hash is appended.
bytecode_hash = "none"
cbor_metadata = true
use_literal_content = true
# Our own sources must compile without warnings; pinned libraries are not ours to edit.
deny = "warnings"
ignored_warnings_from = ["node_modules"]

# Local execution follows Monad's rules (gas schedule, limits), as the Monad documentation requires.
network = "monad"

ffi = false
# Tests read the committed cross-language vectors and nothing else.
fs_permissions = [{ access = "read", path = "../fixtures/registry-v1" }]

[fuzz]
runs = 256
seed = "0x4c657841656769732e50726f6f664f665265766965772e7631"

[invariant]
runs = 64
depth = 64
fail_on_revert = true

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"
sort_imports = true
